name: Copilot Review Reminder

on:
  pull_request:
    types: [opened, ready_for_review]

jobs:
  add-review-reminder:
    runs-on: ubuntu-latest
    if: ${{ !github.event.pull_request.draft }}
    permissions:
      pull-requests: write
      issues: write

    steps:
    - name: Add Review Reminder Comment
      uses: actions/github-script@v7
      with:
        script: |
          const pr_number = context.issue.number;
          const owner = context.repo.owner;
          const repo = context.repo.repo;

          const body = [
            '## 🤖 Automated Review Options',
            '',
            'This PR is ready for review! You can:',
            '',
            '1. **Request Copilot Review**: Select "Copilot" from the Reviewers menu in the sidebar to get AI-powered code review feedback',
            '2. **Request Claude Review**: Mention @claude in a comment to get Claude Code\'s analysis',
            '',
            '### To Enable Automatic Copilot Reviews:',
            'If Copilot reviews aren\'t available, ask the repository admin to:',
            '1. Go to Settings → Code, planning, and automation → Repository → Rulesets',
            '2. Create a new branch ruleset',
            '3. Enable "Request pull request review from Copilot"',
            '4. Set enforcement status to Active',
            '',
            'Once enabled, Copilot will automatically review all PRs that match the ruleset criteria.'
          ].join('\n');

          try {
            await github.rest.issues.createComment({
              owner: owner,
              repo: repo,
              issue_number: pr_number,
              body: body
            });
            console.log(`Added review reminder for PR #${pr_number}`);
          } catch (error) {
            console.error('Failed to add review reminder:', error);
          }
